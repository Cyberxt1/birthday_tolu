<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>the_global_tolu Transmission</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap");

    :root {
      --midnight: #02040b;
      --deep: #080b18;
      --cyan: #8be9dd;
      --sapphire: #8d92ff;
      --gold: #f6d365;
      --rose: #d8a7ff;
      --soft: rgba(236, 242, 246, 0.78);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      overflow-x: hidden;
      background: var(--midnight);
      color: #f6feff;
      font-family: "Outfit", system-ui, sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% 48%, rgba(139, 233, 221, 0.07), transparent 25rem),
        radial-gradient(circle at 20% 18%, rgba(216, 167, 255, 0.07), transparent 21rem),
        radial-gradient(circle at 82% 82%, rgba(246, 211, 101, 0.055), transparent 22rem),
        linear-gradient(145deg, var(--midnight) 0%, var(--deep) 58%, #01030a 100%);
    }

    button {
      font: inherit;
      touch-action: manipulation;
    }

    #spaceCanvas,
    #burstCanvas,
    #confettiCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    #spaceCanvas {
      z-index: 0;
    }

    #burstCanvas,
    #confettiCanvas {
      z-index: 1;
    }

    .aurora {
      position: fixed;
      inset: -25%;
      z-index: 1;
      pointer-events: none;
      background:
        radial-gradient(circle at 34% 42%, rgba(139, 233, 221, 0.09), transparent 16%),
        radial-gradient(circle at 66% 44%, rgba(216, 167, 255, 0.08), transparent 18%),
        radial-gradient(circle at 52% 72%, rgba(246, 211, 101, 0.07), transparent 16%);
      filter: blur(50px);
      animation: auroraDrift 12s ease-in-out infinite alternate;
      opacity: 0.58;
    }

    .page {
      position: relative;
      z-index: 2;
      display: grid;
      min-height: 100svh;
      overflow: hidden;
      place-items: center;
      perspective: 1100px;
    }

    .entry-gate {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      padding: 1.25rem;
      color: #fffdf5;
      cursor: pointer;
      background:
        radial-gradient(circle at 50% 44%, rgba(246, 211, 101, 0.1), transparent 20rem),
        rgba(2, 4, 11, 0.42);
      place-items: center;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      transition: opacity 620ms ease, visibility 620ms ease;
    }

    .entry-gate.is-hidden {
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
    }

    body.is-typing #spaceCanvas {
      opacity: 0.28;
    }

    body.is-typing .aurora,
    body.is-typing .stage::before,
    body.is-typing .globe-system,
    body.is-typing .globe-core,
    body.is-typing .orbit,
    body.is-typing .holo-globe::before,
    body.is-typing .holo-globe::after,
    body.is-typing .hotspot,
    body.is-typing .hotspot::before,
    body.is-typing .hotspot-hint {
      animation-play-state: paused !important;
    }

    .entry-gate button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 56px;
      max-width: min(100%, 420px);
      padding: 0.95rem 1.3rem;
      color: inherit;
      font-size: clamp(1.05rem, 4vw, 1.45rem);
      font-weight: 900;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.045)),
        rgba(2, 4, 11, 0.48);
      border: 1px solid rgba(246, 211, 101, 0.28);
      border-radius: 999px;
      box-shadow: 0 0 34px rgba(246, 211, 101, 0.16), inset 0 1px 0 rgba(255, 255, 255, 0.16);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      animation: gatePulse 2.2s ease-in-out infinite;
    }

    .transmission {
      position: relative;
      display: grid;
      width: min(100%, 1120px);
      min-height: 100svh;
      padding: clamp(1rem, 4vw, 2rem);
      place-items: center;
    }

    .signal-label {
      position: absolute;
      top: 50%;
      left: 50%;
      z-index: 9;
      width: min(calc(100% - 2rem), 640px);
      max-height: min(48svh, 380px);
      padding: clamp(1rem, 3vw, 1.35rem);
      overflow: auto;
      color: rgba(248, 251, 255, 0.92);
      font-size: clamp(0.92rem, 2.7vw, 1.08rem);
      font-weight: 500;
      line-height: 1.65;
      letter-spacing: 0;
      text-align: left;
      white-space: pre-wrap;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.11), rgba(255, 255, 255, 0.045)),
        radial-gradient(circle at 18% 0%, rgba(246, 211, 101, 0.11), transparent 44%),
        rgba(2, 4, 11, 0.62);
      border: 1px solid rgba(246, 211, 101, 0.2);
      border-radius: 24px;
      box-shadow: 0 22px 70px rgba(0, 0, 0, 0.42), 0 0 32px rgba(246, 211, 101, 0.1), inset 0 1px 0 rgba(255, 255, 255, 0.13);
      transform: translate(-50%, -46%);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .signal-label::after {
      display: inline-block;
      width: 0.55em;
      height: 1.12em;
      margin-left: 0.12em;
      vertical-align: -0.18em;
      content: "";
      background: var(--gold);
      box-shadow: 0 0 14px rgba(246, 211, 101, 0.72);
      animation: cursorBlink 0.9s steps(2) infinite;
    }

    .signal-label.is-complete::after {
      display: none;
    }

    .stage {
      position: relative;
      display: grid;
      width: min(100%, 900px);
      min-height: 620px;
      padding-top: 5.5rem;
      place-items: center;
      transform-style: preserve-3d;
    }

    .stage::before {
      position: absolute;
      width: min(82vw, 680px);
      height: min(82vw, 680px);
      content: "";
      background: radial-gradient(circle, rgba(139, 233, 221, 0.07), transparent 62%);
      border-radius: 50%;
      filter: blur(16px);
      animation: stagePulse 5s ease-in-out infinite;
    }

    .brand {
      position: absolute;
      top: clamp(1.2rem, 4.5svh, 2.6rem);
      z-index: 10;
      width: min(100%, 720px);
      text-align: center;
      pointer-events: none;
    }

    .brand h1 {
      margin: 0;
      font-size: clamp(2rem, 7.8vw, 4.8rem);
      font-weight: 900;
      line-height: 0.82;
      letter-spacing: 0;
      text-shadow:
        0 0 16px rgba(246, 211, 101, 0.32),
        0 0 46px rgba(139, 233, 221, 0.18),
        0 16px 80px rgba(0, 0, 0, 0.65);
      animation: titleArrival 1.2s cubic-bezier(.19, 1, .22, 1) both;
    }

    .brand p {
      max-width: 560px;
      margin: 0.65rem auto 0;
      color: var(--soft);
      font-size: clamp(0.98rem, 3vw, 1.2rem);
      line-height: 1.6;
      animation: titleArrival 1.2s cubic-bezier(.19, 1, .22, 1) both 0.16s;
    }

    .globe-system {
      position: relative;
      display: grid;
      width: min(82vw, 480px);
      aspect-ratio: 1;
      margin-top: clamp(12rem, 29svh, 16rem);
      opacity: 0.58;
      place-items: center;
      transform-style: preserve-3d;
      animation: systemFloat 6s ease-in-out infinite;
    }

    .holo-globe {
      position: relative;
      width: 62%;
      aspect-ratio: 1;
      overflow: hidden;
      border: 1px solid rgba(152, 244, 255, 0.56);
      border-radius: 50%;
      background:
        radial-gradient(circle at 34% 28%, rgba(255, 255, 255, 0.56), transparent 9%),
        radial-gradient(circle at 50% 50%, rgba(0, 242, 254, 0.2), rgba(79, 172, 254, 0.08) 42%, rgba(0, 0, 0, 0.42) 72%),
        linear-gradient(120deg, rgba(0, 242, 254, 0.28), rgba(79, 172, 254, 0.07));
      box-shadow:
        0 0 30px rgba(0, 242, 254, 0.55),
        0 0 88px rgba(79, 172, 254, 0.32),
        inset -28px -18px 62px rgba(0, 0, 0, 0.48),
        inset 18px 8px 42px rgba(255, 255, 255, 0.12);
      transform: rotateX(62deg) rotateZ(-18deg);
      transform-style: preserve-3d;
    }

    .holo-globe::before,
    .holo-globe::after {
      position: absolute;
      inset: 0;
      content: "";
      border-radius: 50%;
    }

    .holo-globe::before {
      background:
        repeating-radial-gradient(ellipse at center, transparent 0 20px, rgba(146, 246, 255, 0.38) 22px 23px),
        repeating-linear-gradient(90deg, transparent 0 26px, rgba(0, 242, 254, 0.22) 28px 29px);
      animation: globeLines 8s linear infinite;
      mix-blend-mode: screen;
    }

    .holo-globe::after {
      background:
        radial-gradient(circle at 30% 28%, rgba(255, 255, 255, 0.28), transparent 13%),
        linear-gradient(90deg, transparent 0%, rgba(0, 242, 254, 0.18) 45%, transparent 60%);
      animation: scan 3.2s ease-in-out infinite;
    }

    .globe-core {
      position: absolute;
      width: 74%;
      aspect-ratio: 1;
      border-radius: 50%;
      border: 1px solid rgba(0, 242, 254, 0.22);
      box-shadow: 0 0 44px rgba(0, 242, 254, 0.26), inset 0 0 34px rgba(79, 172, 254, 0.18);
      animation: reverseSpin 12s linear infinite;
    }

    .orbit {
      position: absolute;
      inset: 0;
      display: grid;
      border: 1px solid rgba(0, 242, 254, 0.22);
      border-radius: 50%;
      place-items: center;
      transform: rotateX(68deg) rotateZ(0deg);
      transform-style: preserve-3d;
      animation: orbitSpin 17s linear infinite;
    }

    .orbit-text {
      position: absolute;
      display: inline-flex;
      gap: clamp(0.8rem, 3vw, 1.2rem);
      align-items: center;
      width: max-content;
      color: #eafdff;
      font-size: clamp(0.78rem, 2.6vw, 1rem);
      font-weight: 900;
      letter-spacing: 0.14em;
      text-shadow: 0 0 12px rgba(0, 242, 254, 0.78);
      text-transform: uppercase;
      transform: translateY(calc(-1 * min(41vw, 240px))) rotateX(-68deg);
    }

    .orbit-text span {
      color: var(--gold);
      text-shadow: 0 0 16px rgba(246, 211, 101, 0.72);
    }

    .pitch-pill {
      position: absolute;
      right: clamp(0.4rem, 6vw, 3rem);
      bottom: clamp(2rem, 9vw, 4rem);
      z-index: 8;
      display: inline-flex;
      gap: 0.65rem;
      align-items: center;
      min-height: 48px;
      padding: 0.78rem 1rem;
      color: #f8ffff;
      font-weight: 800;
      background: rgba(5, 21, 44, 0.42);
      border: 1px solid rgba(0, 242, 254, 0.42);
      border-radius: 999px;
      box-shadow: 0 0 28px rgba(0, 242, 254, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.17);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      transition: transform 180ms ease, box-shadow 180ms ease;
      animation: pillFloat 4.8s ease-in-out infinite;
    }

    .pitch-pill:focus-visible,
    .pitch-pill:hover {
      outline: none;
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 0 42px rgba(0, 242, 254, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }

    .wave-bars {
      display: inline-flex;
      gap: 3px;
      align-items: center;
      width: 34px;
      height: 20px;
    }

    .wave-bars i {
      width: 3px;
      height: 8px;
      background: var(--cyan);
      border-radius: 99px;
      box-shadow: 0 0 10px rgba(0, 242, 254, 0.8);
      animation: idleWave 1.1s ease-in-out infinite;
    }

    .wave-bars i:nth-child(2) { animation-delay: 0.1s; }
    .wave-bars i:nth-child(3) { animation-delay: 0.2s; }
    .wave-bars i:nth-child(4) { animation-delay: 0.3s; }
    .wave-bars i:nth-child(5) { animation-delay: 0.4s; }

    .pitch-pill.is-active .wave-bars i {
      animation: activeWave 0.36s ease-in-out infinite;
      background: var(--gold);
      box-shadow: 0 0 14px rgba(246, 211, 101, 0.88);
    }

    .hotspot {
      position: fixed;
      left: max(0.7rem, env(safe-area-inset-left));
      top: 50%;
      z-index: 14;
      display: grid;
      width: clamp(42px, 11vw, 58px);
      aspect-ratio: 1;
      color: #eaffff;
      cursor: pointer;
      background: radial-gradient(circle at 35% 25%, rgba(255, 255, 255, 0.38), rgba(0, 242, 254, 0.16) 42%, rgba(79, 172, 254, 0.08) 72%);
      border: 1px solid rgba(154, 247, 255, 0.42);
      border-radius: 50%;
      opacity: 0;
      pointer-events: none;
      place-items: center;
      box-shadow: 0 0 28px rgba(0, 242, 254, 0.5), inset 0 0 18px rgba(255, 255, 255, 0.14);
      transform: translateY(-50%) translateX(-20px) scale(0.75);
      animation: hotspotFloat 3.8s ease-in-out infinite;
      transition: opacity 520ms ease, transform 520ms cubic-bezier(.19, 1, .22, 1);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .hotspot.is-visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(-50%) translateX(0) scale(1);
    }

    .hotspot::before {
      position: absolute;
      inset: -10px;
      content: "";
      border: 1px solid rgba(0, 242, 254, 0.32);
      border-radius: 50%;
      animation: ripple 1.8s ease-out infinite;
    }

    .hotspot span {
      font-size: clamp(1.15rem, 5vw, 1.55rem);
      filter: drop-shadow(0 0 12px rgba(0, 242, 254, 0.8));
      transform: translateZ(24px);
    }

    .hotspot-hint {
      position: fixed;
      left: max(4.2rem, calc(env(safe-area-inset-left) + 4.2rem));
      top: 50%;
      z-index: 14;
      max-width: min(58vw, 230px);
      padding: 0.7rem 0.86rem;
      color: rgba(255, 253, 245, 0.92);
      font-size: clamp(0.78rem, 2.8vw, 0.92rem);
      font-weight: 800;
      line-height: 1.25;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.045)),
        rgba(2, 4, 11, 0.62);
      border: 1px solid rgba(246, 211, 101, 0.24);
      border-radius: 999px;
      box-shadow: 0 0 28px rgba(246, 211, 101, 0.14), inset 0 1px 0 rgba(255, 255, 255, 0.14);
      opacity: 0;
      pointer-events: none;
      transform: translateY(-50%) translateX(-12px);
      transition: opacity 520ms ease, transform 520ms cubic-bezier(.19, 1, .22, 1);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .hotspot-hint::before {
      position: absolute;
      top: 50%;
      left: -7px;
      width: 12px;
      height: 12px;
      content: "";
      background: rgba(2, 4, 11, 0.72);
      border-bottom: 1px solid rgba(246, 211, 101, 0.2);
      border-left: 1px solid rgba(246, 211, 101, 0.2);
      transform: translateY(-50%) rotate(45deg);
    }

    .hotspot-hint.is-visible {
      opacity: 1;
      transform: translateY(-50%) translateX(0);
      animation: hintNudge 1.7s ease-in-out infinite 0.5s;
    }

    .tap-zone {
      position: fixed;
      z-index: 10;
      width: min(32vw, 150px);
      height: min(32vw, 150px);
      border: 0;
      opacity: 0;
      cursor: pointer;
    }

    .tap-zone.top-left {
      top: 0;
      left: 0;
    }

    .tap-zone.bottom-left {
      bottom: 0;
      left: 0;
      height: min(38vw, 170px);
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 35;
      display: grid;
      padding: 1rem;
      pointer-events: none;
      background: radial-gradient(circle at 50% 52%, rgba(0, 242, 254, 0.17), rgba(3, 7, 18, 0.72) 58%, rgba(3, 7, 18, 0.88));
      opacity: 0;
      place-items: center;
      transition: opacity 260ms ease;
      backdrop-filter: blur(0);
      -webkit-backdrop-filter: blur(0);
    }

    .modal.is-open {
      pointer-events: auto;
      opacity: 1;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .wish-panel {
      position: relative;
      display: grid;
      width: min(100%, 560px);
      padding: clamp(1.1rem, 5vw, 2rem);
      text-align: center;
      background: linear-gradient(145deg, rgba(0, 242, 254, 0.1), rgba(255, 255, 255, 0.07));
      border: 1px solid rgba(132, 244, 255, 0.3);
      border-radius: 28px;
      box-shadow: 0 0 60px rgba(0, 242, 254, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.14);
      transform: translateY(24px) rotateX(8deg) scale(0.96);
      transform-style: preserve-3d;
      transition: transform 360ms cubic-bezier(.19, 1, .22, 1);
    }

    .modal.is-open .wish-panel {
      transform: translateY(0) rotateX(0deg) scale(1);
    }

    .close-modal {
      position: absolute;
      top: 0.8rem;
      right: 0.8rem;
      display: grid;
      width: 40px;
      height: 40px;
      color: rgba(236, 253, 255, 0.86);
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 50%;
      place-items: center;
    }

    .cake {
      position: relative;
      width: min(70vw, 250px);
      height: 230px;
      margin: 1.25rem auto 0.25rem;
      transform: rotateX(10deg);
      transform-style: preserve-3d;
    }

    .plate {
      position: absolute;
      right: 12%;
      bottom: 8px;
      left: 12%;
      height: 28px;
      background: radial-gradient(ellipse, rgba(232, 253, 255, 0.72), rgba(0, 242, 254, 0.2) 58%, transparent 72%);
      border-radius: 50%;
      filter: drop-shadow(0 0 18px rgba(0, 242, 254, 0.5));
    }

    .layer {
      position: absolute;
      left: 50%;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.24);
      border-radius: 24px 24px 12px 12px;
      box-shadow: inset 0 8px 18px rgba(255, 255, 255, 0.18), 0 18px 38px rgba(0, 0, 0, 0.28);
      transform: translateX(-50%);
    }

    .layer.bottom {
      bottom: 28px;
      width: 210px;
      height: 76px;
      background: linear-gradient(135deg, #2de2ff, #467dff 58%, #123776);
    }

    .layer.top {
      bottom: 92px;
      width: 156px;
      height: 64px;
      background: linear-gradient(135deg, #f6d365, #35e7ff 46%, #3264d8);
    }

    .layer::before {
      position: absolute;
      inset: 0;
      content: "";
      background: repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.18) 0 8px, transparent 8px 24px);
      opacity: 0.5;
    }

    .candle {
      position: absolute;
      bottom: 152px;
      width: 12px;
      height: 52px;
      background: repeating-linear-gradient(45deg, #e9fbff 0 7px, #4facfe 7px 13px);
      border-radius: 99px;
      box-shadow: 0 0 14px rgba(0, 242, 254, 0.28);
    }

    .candle:nth-of-type(4) { left: 34%; }
    .candle:nth-of-type(5) { left: 48%; bottom: 162px; }
    .candle:nth-of-type(6) { left: 62%; }

    .flame {
      position: absolute;
      left: 50%;
      bottom: 48px;
      width: 18px;
      height: 26px;
      background: radial-gradient(circle at 50% 72%, #fff7b0 0 20%, #f6d365 30%, #ff7b2f 62%, transparent 70%);
      border-radius: 60% 60% 50% 50%;
      box-shadow: 0 0 20px rgba(246, 211, 101, 0.95), 0 0 34px rgba(255, 123, 47, 0.6);
      transform: translateX(-50%) rotate(-4deg);
      transform-origin: 50% 100%;
      animation: flicker 0.16s infinite alternate;
    }

    .wish-panel.blown .flame {
      animation: flameOut 580ms ease forwards;
    }

    .smoke {
      position: absolute;
      left: 50%;
      bottom: 48px;
      width: 18px;
      height: 18px;
      color: rgba(222, 251, 255, 0.88);
      font-size: 1rem;
      opacity: 0;
      transform: translateX(-50%);
    }

    .wish-panel.blown .smoke {
      animation: smokeRise 1.8s ease-out forwards 0.36s;
    }

    .wish-title {
      margin: 0;
      font-size: clamp(1.75rem, 7vw, 3rem);
      font-weight: 900;
      line-height: 1;
      text-shadow: 0 0 22px rgba(0, 242, 254, 0.5);
    }

    .wish-copy,
    .transmitted,
    .save-status {
      margin: 0.8rem auto 0;
      color: var(--soft);
      font-size: clamp(1rem, 3vw, 1.18rem);
      line-height: 1.5;
    }

    .wish-form {
      display: grid;
      gap: 0.85rem;
      margin-top: 1rem;
    }

    .wish-input {
      width: 100%;
      min-height: 122px;
      padding: 0.95rem 1rem;
      color: #f7feff;
      font: inherit;
      line-height: 1.55;
      resize: vertical;
      background: rgba(2, 14, 30, 0.52);
      border: 1px solid rgba(0, 242, 254, 0.28);
      border-radius: 18px;
      outline: none;
      box-shadow: inset 0 0 26px rgba(0, 0, 0, 0.22), 0 0 18px rgba(0, 242, 254, 0.08);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .wish-input:focus {
      border-color: rgba(0, 242, 254, 0.64);
      box-shadow: inset 0 0 26px rgba(0, 0, 0, 0.22), 0 0 28px rgba(0, 242, 254, 0.22);
    }

    .cake-stage {
      display: block;
    }

    .wish-panel.is-wish-saved .wish-form {

  <script>
    const spaceCanvas = document.getElementById("spaceCanvas");
    const spaceCtx = spaceCanvas.getContext("2d");
    const burstCanvas = document.getElementById("burstCanvas");
    const burstCtx = burstCanvas.getContext("2d");
    const confettiCanvas = document.getElementById("confettiCanvas");
    const confettiEngine = confetti.create(confettiCanvas, {
      resize: true,
      useWorker: true
    });
    const songOne = document.getElementById("songOne");
    const songTwo = document.getElementById("songTwo");
    const songThree = document.getElementById("songThree");
    const topLeftZone = document.getElementById("topLeftZone");
    const bottomLeftZone = document.getElementById("bottomLeftZone");
    const wishHotspot = document.getElementById("wishHotspot");
    const wishModal = document.getElementById("wishModal");
    const wishPanel = document.getElementById("wishPanel");
    const typewriterMessage = document.getElementById("typewriterMessage");
    const lightLeak = document.getElementById("lightLeak");
    const shareButton = document.getElementById("shareButton");
    const entryGate = document.getElementById("entryGate");
    const globalTitle = document.getElementById("globalTitle");
    const hotspotHint = document.getElementById("hotspotHint");

    wishPanel.innerHTML = `
      <button class="close-modal" id="closeModal" type="button" aria-label="Close wish experience">&times;</button>
      <h2 class="wish-title" id="wishHeading">Make your birthday wish...</h2>
      <p class="wish-copy">Close your eyes for a second, make the wish, then blow your candles.</p>
      <div class="cake-stage">
        <div class="cake" aria-label="Birthday cake with three candles">
          <div class="plate"></div>
          <div class="layer bottom"></div>
          <div class="layer top"></div>
          <div class="candle"><span class="flame"></span><span class="smoke">&#128168;</span></div>
          <div class="candle"><span class="flame"></span><span class="smoke">&#128168;</span></div>
          <div class="candle"><span class="flame"></span><span class="smoke">&#128168;</span></div>
        </div>
        <button class="blow-button" id="blowButton" type="button">Blow Out Candles</button>
      </div>
      <p class="transmitted">Wish Transmitted Globally &#127757;&#10024;</p>
    `;

    const closeModal = document.getElementById("closeModal");
    const blowButton = document.getElementById("blowButton");

    const songVolumes = new Map([
      [songOne, 0.2],
      [songTwo, 0.4],
      [songThree, 0.7]
    ]);

    [songOne, songTwo, songThree].forEach((song) => {
      song.volume = 0;
    });
    songOne.volume = songVolumes.get(songOne);

    let width = 0;
    let height = 0;
    let ratio = 1;
    let stars = [];
    let shootingStars = [];
    let emojiParticles = [];
    let hasAttemptedAudio = false;
    let hasStartedExperience = false;
    let lastBackgroundFrame = 0;
    let emojiLoopRunning = false;

    const rand = (min, max) => Math.random() * (max - min) + min;

    [songOne, songTwo, songThree].forEach((song) => {
      song.load();
    });

    async function playBackgroundOnce() {
      if (hasAttemptedAudio && !songOne.paused) return true;
      hasAttemptedAudio = true;
      [songTwo, songThree].forEach((song) => {
        song.pause();
        song.currentTime = 0;
        song.volume = 0;
      });
      songOne.volume = songVolumes.get(songOne);
      try {
        await songOne.play();
        return true;
      } catch (error) {
        hasAttemptedAudio = false;
        return false;
      }
    }

    async function startExperience() {
      if (hasStartedExperience) return;
      const didStartAudio = await playBackgroundOnce();
      if (!didStartAudio) return;

      hasStartedExperience = true;
      entryGate.classList.add("is-hidden");
      setTimeout(() => typeMessage(), 420);
    }

    function retrySongOneOnGesture() {
      if (!hasStartedExperience || !songOne.paused || !songTwo.paused || !songThree.paused) return;
      playBackgroundOnce();
    }

    entryGate.addEventListener("pointerdown", startExperience);
    entryGate.addEventListener("touchend", startExperience);
    entryGate.addEventListener("click", startExperience);
    window.addEventListener("pointerdown", retrySongOneOnGesture, { passive: true });
    window.addEventListener("touchend", retrySongOneOnGesture, { passive: true });

    function switchSong(from, to, fadeDuration = 350) {
      const started = performance.now();
      const fromStartVolume = from.volume || songVolumes.get(from) || 0;
      const toTargetVolume = songVolumes.get(to) || 0.4;

      [songOne, songTwo, songThree].forEach((song) => {
        if (song !== from && song !== to) {
          song.pause();
          song.currentTime = 0;
          song.volume = 0;
        }
      });

      to.currentTime = 0;
      to.volume = toTargetVolume;
      to.play().catch(() => {});

      function step(now) {
        const progress = Math.min(1, (now - started) / fadeDuration);
        from.volume = Math.max(0, fromStartVolume * (1 - progress));

        if (progress < 1) {
          requestAnimationFrame(step);
        } else {
          from.pause();
          from.currentTime = 0;
          from.volume = 0;
          to.volume = toTargetVolume;
        }
      }

      requestAnimationFrame(step);
    }

    function playFinalSong() {
      switchSong(songTwo, songThree, 280);
    }

    const birthdayMessage = `Happy Birthday, Toluwanimi! âœ¨

I just want to wish you a happy birthday! In the short time we've talked, it's already super obvious how grounded, smart, and capable you are.

As you step into this new age, I pray you never loose sight of how much potential you carry. May this year be kind to you, surprise you in the best ways possible, and bring you closer to every single goal you are chasing. Enjoy every second of your day!`;

    function typeMessage(index = 0) {
      if (index <= birthdayMessage.length) {
        typewriterMessage.textContent = birthdayMessage.slice(0, index);
        const char = birthdayMessage[index] || "";
        const delay = char === "." ? 620 : char === "!" ? 480 : char === "," ? 170 : char === "\n" ? 420 : 68;
        setTimeout(() => typeMessage(index + 1), delay);
        return;
      }

      typewriterMessage.classList.add("is-complete");
      wishHotspot.classList.add("is-visible");
      hotspotHint.classList.add("is-visible");
    }

    function resizeCanvases() {
      ratio = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;

      [spaceCanvas, burstCanvas].forEach((canvas) => {
        canvas.width = Math.floor(width * ratio);
        canvas.height = Math.floor(height * ratio);
        canvas.style.width = `${width}px`;
        canvas.style.height = `${height}px`;
      });

      spaceCtx.setTransform(ratio, 0, 0, ratio, 0, 0);
      burstCtx.setTransform(ratio, 0, 0, ratio, 0, 0);

      stars = Array.from({ length: Math.min(70, Math.floor(width * height / 18000)) }, () => ({
        x: Math.random() * width,
        y: Math.random() * height,
        z: rand(0.25, 1),
        r: rand(0.4, 1.8),
        speed: rand(0.08, 0.42),
        glow: rand(0.28, 0.9)
      }));
    }

    function drawBackground(time) {
      requestAnimationFrame(drawBackground);

      const frameGap = document.body.classList.contains("is-typing") ? 140 : 50;
      if (time - lastBackgroundFrame < frameGap) return;
      lastBackgroundFrame = time;

      spaceCtx.clearRect(0, 0, width, height);
      spaceCtx.globalCompositeOperation = "source-over";

      const bgGlow = spaceCtx.createRadialGradient(width / 2, height / 2, 0, width / 2, height / 2, Math.max(width, height) * 0.62);
      bgGlow.addColorStop(0, "rgba(139, 233, 221, 0.035)");
      bgGlow.addColorStop(0.48, "rgba(216, 167, 255, 0.022)");
      bgGlow.addColorStop(1, "rgba(3, 7, 18, 0)");
      spaceCtx.fillStyle = bgGlow;
      spaceCtx.fillRect(0, 0, width, height);

      spaceCtx.globalCompositeOperation = "lighter";

      stars.forEach((star) => {
        star.y += star.speed * star.z;
        star.x += Math.sin(time * 0.0004 + star.y * 0.01) * 0.08;
        if (star.y > height + 8) {
          star.y = -8;
          star.x = Math.random() * width;
        }
        const pulse = 0.45 + Math.sin(time * 0.002 + star.x) * 0.25 + star.glow;
        spaceCtx.beginPath();
        spaceCtx.fillStyle = `rgba(219, 246, 242, ${Math.min(0.5, pulse * 0.5)})`;
        spaceCtx.shadowColor = "rgba(139, 233, 221, 0.45)";
        spaceCtx.shadowBlur = 7 * star.z;
        spaceCtx.arc(star.x, star.y, star.r * star.z, 0, Math.PI * 2);
        spaceCtx.fill();
      });

      if (Math.random() < 0.012 && shootingStars.length < 4) {
        shootingStars.push({
          x: rand(width * 0.08, width * 0.92),
          y: rand(-40, height * 0.38),
          vx: rand(-10, -5),
          vy: rand(5, 9),
          life: 1,
          decay: rand(0.012, 0.02)
        });
      }

      shootingStars = shootingStars.filter((star) => star.life > 0);
      shootingStars.forEach((star) => {
        star.x += star.vx;
        star.y += star.vy;
        star.life -= star.decay;

        const tail = 120 * star.life;
        const gradient = spaceCtx.createLinearGradient(star.x, star.y, star.x - star.vx * tail * 0.12, star.y - star.vy * tail * 0.12);
        gradient.addColorStop(0, `rgba(246, 211, 101, ${star.life * 0.8})`);
        gradient.addColorStop(0.35, `rgba(139, 233, 221, ${star.life * 0.4})`);
        gradient.addColorStop(1, "rgba(139, 233, 221, 0)");
        spaceCtx.strokeStyle = gradient;
        spaceCtx.lineWidth = 2;
        spaceCtx.shadowColor = "rgba(246, 211, 101, 0.55)";
        spaceCtx.shadowBlur = 12;
        spaceCtx.beginPath();
        spaceCtx.moveTo(star.x, star.y);
        spaceCtx.lineTo(star.x - star.vx * tail * 0.12, star.y - star.vy * tail * 0.12);
        spaceCtx.stroke();
      });

      if (!document.body.classList.contains("is-typing")) {
        drawRotatingGrid(time);
      }
    }

    function projectPoint(x, y, z, cx, cy, size) {
      const depth = 2.9 + z;
      return {
        x: cx + (x / depth) * size,
        y: cy + (y / depth) * size,
        alpha: Math.max(0.08, Math.min(1, (z + 1.5) / 3))
      };
    }

    function rotateY(x, z, angle) {
      return {
        x: x * Math.cos(angle) - z * Math.sin(angle),
        z: x * Math.sin(angle) + z * Math.cos(angle)
      };
    }

    function drawRotatingGrid(time) {
      const cx = width / 2;
      const cy = height / 2 + Math.min(90, height * 0.07);
      const size = Math.min(width, height) * 0.72;
      const angle = time * 0.00018;

      spaceCtx.lineWidth = 1;
      spaceCtx.shadowColor = "rgba(139, 233, 221, 0.35)";
      spaceCtx.shadowBlur = 5;

      for (let lat = -60; lat <= 60; lat += 30) {
        spaceCtx.beginPath();
        let first = true;
        for (let lon = 0; lon <= 360; lon += 8) {
          const phi = lat * Math.PI / 180;
          const theta = lon * Math.PI / 180;
          const radius = Math.cos(phi);
          let x = radius * Math.cos(theta);
          let y = Math.sin(phi);
          let z = radius * Math.sin(theta);
          const rotated = rotateY(x, z, angle);
          const p = projectPoint(rotated.x, y, rotated.z, cx, cy, size);
          spaceCtx.strokeStyle = `rgba(139, 233, 221, ${0.025 + p.alpha * 0.06})`;
          if (first) {
            spaceCtx.moveTo(p.x, p.y);
            first = false;
          } else {
            spaceCtx.lineTo(p.x, p.y);
          }
        }
        spaceCtx.stroke();
      }

      for (let lon = 0; lon < 180; lon += 36) {
        spaceCtx.beginPath();
        let first = true;
        for (let lat = -90; lat <= 90; lat += 7) {
          const phi = lat * Math.PI / 180;
          const theta = lon * Math.PI / 180;
          const radius = Math.cos(phi);
          let x = radius * Math.cos(theta);
          let y = Math.sin(phi);
          let z = radius * Math.sin(theta);
          const rotated = rotateY(x, z, angle);
          const p = projectPoint(rotated.x, y, rotated.z, cx, cy, size);
          spaceCtx.strokeStyle = `rgba(246, 211, 101, ${0.018 + p.alpha * 0.045})`;
          if (first) {
            spaceCtx.moveTo(p.x, p.y);
            first = false;
          } else {
            spaceCtx.lineTo(p.x, p.y);
          }
        }
        spaceCtx.stroke();
      }
    }

    function spawnEmoji(text, x, y, vx, vy, size) {
      emojiParticles.push({
        text,
        x,
        y,
        vx,
        vy,
        size,
        gravity: rand(0.05, 0.16),
        rotation: rand(-0.2, 0.2),
        spin: rand(-0.08, 0.08),
        life: 1,
        decay: rand(0.008, 0.014)
      });
      startEmojiLoop();
    }

    function spawnFastEmoji(text, x, y, vx, vy, size) {
      if (emojiParticles.length > 140) {
        emojiParticles.splice(0, emojiParticles.length - 140);
      }

      emojiParticles.push({
        text,
        x,
        y,
        vx,
        vy,
        size,
        gravity: rand(0.1, 0.2),
        rotation: rand(-0.28, 0.28),
        spin: rand(-0.12, 0.12),
        life: 1,
        decay: rand(0.035, 0.055)
      });
      startEmojiLoop();
    }

    function startEmojiLoop() {
      if (emojiLoopRunning) return;
      emojiLoopRunning = true;
      requestAnimationFrame(animateEmoji);
    }

    function animateEmoji() {
      burstCtx.clearRect(0, 0, width, height);
      if (!emojiParticles.length) {
        emojiLoopRunning = false;
        return;
      }

      burstCtx.textAlign = "center";
      burstCtx.textBaseline = "middle";

      emojiParticles = emojiParticles.filter((p) => p.life > 0);
      emojiParticles.forEach((p) => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += p.gravity;
        p.rotation += p.spin;
        p.life -= p.decay;

        burstCtx.save();
        burstCtx.globalAlpha = Math.max(0, p.life);
        burstCtx.translate(p.x, p.y);
        burstCtx.rotate(p.rotation);
        burstCtx.font = `${p.size}px "Apple Color Emoji", "Segoe UI Emoji", sans-serif`;
        burstCtx.shadowColor = "rgba(0, 242, 254, 0.65)";
        burstCtx.shadowBlur = 16;
        burstCtx.fillText(p.text, 0, 0);
        burstCtx.restore();
      });

      requestAnimationFrame(animateEmoji);
    }

    function topLeftBurst() {
      const icons = ["ðŸŽ‚", "ðŸŽ‰", "ðŸŽŠ", "âœ¨"];
      for (let i = 0; i < 42; i += 1) {
        spawnEmoji(icons[i % icons.length], 18, 18, rand(2.4, 10), rand(1.2, 8), rand(22, 44));
      }
      confettiEngine({
        particleCount: 120,
        spread: 78,
        angle: 45,
        origin: { x: 0, y: 0 },
        colors: ["#00f2fe", "#4facfe", "#f6d365", "#ffffff"]
      });
    }

    function bottomCornerStream() {
      const icons = ["â¤ï¸", "â¤ï¸", "â¤ï¸", "â¤ï¸", "ðŸŽ‚"];
      for (let i = 0; i < 38; i += 1) {
        const fromLeft = i % 2 === 0;
        spawnFastEmoji(
          icons[i % icons.length],
          fromLeft ? 16 : width - 16,

          fromLeft ? rand(3.8, 9.8) : rand(-9.8, -3.8),
          rand(-16, -9),
          rand(22, 36)
        );
      }
      confettiEngine({
        particleCount: 70,
        angle: 68,
        spread: 62,
        origin: { x: 0, y: 1 },
        colors: ["#00f2fe", "#4facfe", "#f6d365", "#ffffff"]
      });
      confettiEngine({
        particleCount: 70,
        angle: 112,
        spread: 62,
        origin: { x: 1, y: 1 },
        colors: ["#00f2fe", "#4facfe", "#f6d365", "#ffffff"]
      });
    }

    function loveSpray(duration = 12000) {
      const end = Date.now() + duration;
      const icons = ["â¤ï¸", "â¤ï¸", "â¤ï¸", "â¤ï¸", "ðŸŽ‚"];
      let lastSpawn = 0;

      (function frame(now) {
        if (now - lastSpawn > 55) {
          lastSpawn = now;

          for (let i = 0; i < 4; i += 1) {
            const fromLeft = i % 2 === 0;
            spawnFastEmoji(
              icons[Math.floor(Math.random() * icons.length)],
              fromLeft ? rand(12, 50) : rand(width - 50, width - 12),
              height - rand(6, 34),
              fromLeft ? rand(3.5, 8.5) : rand(-8.5, -3.5),
              rand(-15.5, -8.5),
              rand(20, 34)
            );
          }
        }

        if (Date.now() < end) requestAnimationFrame(frame);
      }());
    }

    function confettiRain(duration = 4200) {
      const end = Date.now() + duration;
      const colors = ["#f6d365", "#8be9dd", "#d8a7ff", "#ffffff"];

      (function frame() {
        confettiEngine({
          particleCount: 7,
          startVelocity: 0,
          ticks: 220,
          gravity: 0.72,
          spread: 90,
          scalar: rand(0.75, 1.15),
          origin: { x: Math.random(), y: -0.08 },
          colors
        });

        if (Date.now() < end) requestAnimationFrame(frame);
      }());
    }

    function openWishModal() {
      wishPanel.classList.remove("blown");
      shareButton.classList.remove("is-visible");
      hotspotHint.classList.remove("is-visible");
      document.body.classList.add("is-typing");
      wishModal.classList.add("is-open");
      switchSong(songOne, songTwo, 320);
      blowButton.focus({ preventScroll: true });
    }

    function closeWishModal() {
      wishModal.classList.remove("is-open");
      document.body.classList.remove("is-typing");
    }

    function blowCandles() {
      if (wishPanel.classList.contains("blown")) return;
      wishPanel.classList.add("blown");
      lightLeak.classList.remove("is-active");
      void lightLeak.offsetWidth;
      lightLeak.classList.add("is-active");
      playFinalSong();
      globalTitle.textContent = "It's your Birthday ðŸŽ‚";
      confettiRain(3600);
      loveSpray(12000);
      setTimeout(() => {
        closeWishModal();
        shareButton.classList.add("is-visible");
      }, 2300);

      const end = Date.now() + 2600;
      const colors = ["#00f2fe", "#4facfe", "#f6d365", "#ffffff"];

      (function fireworkFrame() {
        confettiEngine({
          particleCount: 24,
          startVelocity: 34,
          spread: 360,
          ticks: 80,
          origin: { x: Math.random(), y: rand(0.12, 0.62) },
          colors
        });
        confettiEngine({
          particleCount: 10,
          angle: 60,
          spread: 72,
          origin: { x: 0, y: 0.72 },
          colors
        });
        confettiEngine({
          particleCount: 10,
          angle: 120,
          spread: 72,
          origin: { x: 1, y: 0.72 },
          colors
        });

        if (Date.now() < end) requestAnimationFrame(fireworkFrame);
      }());
    }

    async function shareImage() {
      shareButton.textContent = "Preparing image...";
      shareButton.disabled = true;
      const modalDisplay = wishModal.style.display;
      const buttonDisplay = shareButton.style.display;
      wishModal.style.display = "none";
      shareButton.style.display = "none";

      try {
        await new Promise((resolve) => requestAnimationFrame(resolve));
        const canvas = await html2canvas(document.body, {
          backgroundColor: "#02040b",
          scale: Math.min(window.devicePixelRatio || 1, 2),
          useCORS: true
        });

        const blob = await new Promise((resolve) => canvas.toBlob(resolve, "image/png"));
        const file = new File([blob], "happy-birthday-global-tolu.png", { type: "image/png" });

        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file] });
        } else {
          const link = document.createElement("a");
          link.href = URL.createObjectURL(blob);
          link.download = "happy-birthday-global-tolu.png";
          link.click();
          URL.revokeObjectURL(link.href);
        }
      } finally {
        wishModal.style.display = modalDisplay;
        shareButton.style.display = buttonDisplay;
        shareButton.textContent = "Share to Status";
        shareButton.disabled = false;
      }
    }

    topLeftZone.addEventListener("pointerdown", (event) => {
      event.stopPropagation();
      topLeftBurst();
    });

    bottomLeftZone.addEventListener("pointerdown", (event) => {
      event.stopPropagation();
      bottomCornerStream();
    });

    wishHotspot.addEventListener("click", openWishModal);
    closeModal.addEventListener("click", closeWishModal);
    blowButton.addEventListener("click", blowCandles);
    shareButton.addEventListener("click", shareImage);

    wishModal.addEventListener("click", (event) => {
      if (event.target === wishModal) closeWishModal();
    });

    window.addEventListener("keydown", (event) => {
      if (event.key === "Escape") closeWishModal();
    });

    window.addEventListener("resize", resizeCanvases);
    resizeCanvases();
    requestAnimationFrame(drawBackground);
  </script>
